<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- GymTime stopwatch: the source for every icon and splash image.
       Edit this, then run `npm run assets` to regenerate the PNGs and
       Android resources.

       Colours are copied from src/index.css: ground #15171a is the dark
       theme's --ground, accent #e8692e is the default accent (orange) on
       that ground. Two deliberate decisions:
       - The icon bakes in the DEFAULT accent. It does not follow the
         user's chosen accent and cannot: an icon is fixed at build time,
         and it is the app's identity, not a preference.
       - The elapsed sweep stays a filled wedge rather than the timer
         dial's thin stroked arc. A thin ring disappears at launcher size,
         and an icon may simplify what the screen draws in full.

       TWO COPIES: the <g id="glyph"> drawing below is also copied inline
       into src/components/BrandMark.tsx (Home's background mark, which has
       to follow the user's accent, so it can't use this file). A change to
       the drawing has to be made in both. -->
  <rect width="1024" height="1024" fill="#15171a"/>
  <g id="glyph" fill="none" stroke="#e8692e" stroke-linecap="round" stroke-linejoin="round">
    <!-- crown and stem -->
    <rect x="452" y="128" width="120" height="64" rx="24" fill="#e8692e" stroke="none"/>
    <rect x="490" y="180" width="44" height="80" fill="#e8692e" stroke="none"/>
    <!-- side button at 1 o'clock -->
    <rect x="742" y="226" width="96" height="52" rx="20" fill="#e8692e" stroke="none" transform="rotate(45 790 252)"/>
    <!-- case -->
    <circle cx="512" cy="584" r="300" stroke-width="64"/>
    <!-- elapsed sweep, 12 to 4 o'clock -->
    <path d="M512 584 L512 344 A240 240 0 0 1 719.8 704 Z" fill="#e8692e" fill-opacity="0.28" stroke="none"/>
    <!-- hand at 4 o'clock and hub -->
    <line x1="512" y1="584" x2="704" y2="695" stroke-width="44"/>
    <circle cx="512" cy="584" r="40" fill="#e8692e" stroke="none"/>
  </g>
</svg>
