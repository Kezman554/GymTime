<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- GymTime stopwatch: the source for every icon and splash image.
       Accent #22c55e on #0b0b0d, the app's own colours. Edit this, then
       run `npm run assets` to regenerate the PNGs and Android resources. -->
  <rect width="1024" height="1024" fill="#0b0b0d"/>
  <g id="glyph" fill="none" stroke="#22c55e" stroke-linecap="round" stroke-linejoin="round">
    <!-- crown and stem -->
    <rect x="452" y="128" width="120" height="64" rx="24" fill="#22c55e" stroke="none"/>
    <rect x="490" y="180" width="44" height="80" fill="#22c55e" stroke="none"/>
    <!-- side button at 1 o'clock -->
    <rect x="742" y="226" width="96" height="52" rx="20" fill="#22c55e" stroke="none" transform="rotate(45 790 252)"/>
    <!-- case -->
    <circle cx="512" cy="584" r="300" stroke-width="64"/>
    <!-- elapsed sweep, 12 to 4 o'clock -->
    <path d="M512 584 L512 344 A240 240 0 0 1 719.8 704 Z" fill="#22c55e" fill-opacity="0.28" stroke="none"/>
    <!-- hand at 4 o'clock and hub -->
    <line x1="512" y1="584" x2="704" y2="695" stroke-width="44"/>
    <circle cx="512" cy="584" r="40" fill="#22c55e" stroke="none"/>
  </g>
</svg>
